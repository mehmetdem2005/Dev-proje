[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; Editor-only assets. The brush textures are ~12 MB of painting masks the game
; never reads, and the editor scripts are stripped by Godot anyway.
exclude_filter="addons/terrain_3d/brushes/*, addons/terrain_3d/icons/*, addons/terrain_3d/menu/*"
export_path="build/terrain3d-mobile.apk"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

gradle_build/use_gradle_build=false
package/unique_name="com.example.terrain3dmobile"
package/name="Terrain3D Mobile"
package/signed=true
package/app_category=2
graphics/opengl_debug=false
xr_features/xr_mode=0
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
command_line/extra_args=""
apk_expansion/enable=false
permissions/internet=false
permissions/vibrate=true
permissions/wake_lock=true
; Terrain3D ships arm64 and arm32 .so files; this package keeps arm64 only.
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="1.0.0"
